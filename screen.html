<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>大螢幕｜下一代花蓮地方實踐指南</title>
  <link rel="preload" href="assets/fonts/core-R.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/core-B.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="screen textured">
  <header class="hero">
    <div class="hero__inner">
      <div class="hero__title">下一代花蓮地方實踐指南</div>
      <div class="hero__date"><span class="year">2026</span><span class="line"></span><span>11.07 SAT.</span></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="idle" id="idle">
      <!-- 海報意象：兩隻黑鳥相對、中間一顆桃紅星，加上漂浮的圓點 -->
      <div class="deco" aria-hidden="true">
        <span class="deco__dot deco__dot--lime"></span>
        <span class="deco__dot deco__dot--orange"></span>
        <span class="deco__dot deco__dot--white"></span>
        <span class="deco__dot deco__dot--orange2"></span>
        <div class="deco__pair">
          <span class="bird bird--l"><svg viewBox="0 0 200 140" class="bird__svg"><path d="M0 50 L34 43 C38 25 56 14 72 18 C90 22 96 34 112 44 C150 66 184 84 200 112 C176 130 140 140 110 136 C80 132 58 116 46 96 C40 84 36 70 34 57 Z"/><circle cx="55" cy="37" r="5.5" fill="#1d9be3"/></svg></span>
          <span class="deco__star"></span>
          <span class="bird bird--r"><svg viewBox="0 0 200 140" class="bird__svg"><path d="M0 50 L34 43 C38 25 56 14 72 18 C90 22 96 34 112 44 C150 66 184 84 200 112 C176 130 140 140 110 136 C80 132 58 116 46 96 C40 84 36 70 34 57 Z"/><circle cx="55" cy="37" r="5.5" fill="#1d9be3"/></svg></span>
        </div>
      </div>
      <div class="idle__main">
        <h1 class="idle__title">下一代<br>花蓮地方<br>實踐指南</h1>
        <div class="idle__date">11.07<span class="line"></span><small>SAT.</small></div>
        <div class="idle__count" id="count" hidden>已收到 <strong id="count-n">0</strong> 則提問</div>
      </div>
      <div class="idle__qr">
        <div id="qr"></div>
        <p>掃描 QR Code 提問</p>
      </div>
    </section>

    <section class="question" id="question" hidden>
      <div class="question__tags">
        <span class="tag tag--session" id="q-session"></span>
        <span class="tag tag--speaker" id="q-speaker"></span>
      </div>
      <div class="question__box">
        <div class="question__nick"><span id="q-nick"></span><small>提問：</small></div>
        <div class="question__body" id="q-body"><p class="question__text" id="q-text"></p></div>
      </div>
    </section>

    <div class="drawing" id="drawing" hidden>
      <div class="drawing__star"></div>
      <div>抽籤中</div>
    </div>
  </main>

  <button class="btn btn--sm fs-btn" id="fs" type="button">全螢幕</button>

  <script type="module" src="assets/js/screen.js"></script>
</body>
</html>
